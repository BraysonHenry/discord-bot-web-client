<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bot Web Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-screen">
        <div class="login-card">
            <h2>Discord Bot Client</h2>
            <p>Enter your bot token to connect</p>
            <input type="password" id="tokenInput" placeholder="Bot Token">
            <button onclick="login()">Login</button>
            <p id="status"></p>
        </div>
    </div>

    <div id="app-screen" class="hidden">
        <div id="sidebar">
            <h3>Servers</h3>
            <div id="guild-list"></div>
        </div>
        <div id="main-chat">
            <div id="channel-header">Select a channel</div>
            <div id="chat"></div>
            <div id="message-box">
                <input type="text" id="messageInput" placeholder="Message #channel" onkeypress="checkEnter(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
